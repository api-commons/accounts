aid: base-accounts
name: Accounts
type: Base
description: |-
  A base Accounts API for the API Commons — a starting point you copy into your own
  service rather than a hosted API. Partial updates use RFC 7396 JSON Merge Patch, so a client changes one field without sending the whole account back.

  Errors are RFC 9457 problem details, identical across every API Commons base, and
  checked in CI by the API Commons Problem Details Spectral ruleset.
